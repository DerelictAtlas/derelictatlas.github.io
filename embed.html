<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Derelict Atlas widget</title>
<link rel="stylesheet" href="embed.css">
</head>
<body>
  <div class="ea-card" id="ea-card" aria-live="polite">
    <div class="ea-head"><span class="ea-title">Derelict Freighter</span></div>
    <div class="ea-glyphs" id="ea-glyphs" role="img" hidden></div>
    <div class="ea-msg" id="ea-msg">Scanning this system in your browser…</div>
    <dl class="ea-grid" id="ea-grid" hidden></dl>
    <div class="ea-feature" id="ea-feature" hidden></div>
    <a class="ea-open" id="ea-open" href="https://derelictatlas.github.io/" target="_blank" rel="noopener">Open in Derelict Atlas ↗</a>
  </div>
<pre class="ea-raw" id="ea-raw" hidden>Scanning this system in your browser…</pre>
<script src="site-galaxy.js"></script>
<script src="embed.js"></script>
</body>
</html>
